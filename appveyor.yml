
version: "{build}"
image: Visual Studio 2022
platform: x64
build: off

environment:
  UV_NO_PROGRESS: "1"
  PY64_DIR: "C:\\Python314-x64"

install:
  - set "PATH=%PY64_DIR%;%PY64_DIR%\\Scripts;%PATH%"
  - python --version
  - python -c "import sys, struct; print(sys.executable); print(struct.calcsize('P') * 8)"
  - choco install make -y
  - where make
  - make --version
  - python -m pip install uv
  - uv --version
  - uv sync --no-install-project

test_script:
  - make format
  - make lint
  - make check

on_finish:
  - make clean-all