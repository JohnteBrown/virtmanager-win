version: "{build}"
image: Visual Studio 2022
platform: x64

environment:
  UV_NO_PROGRESS: "1"

install:
  - choco install make -y
  - pip install uv
  - uv --version
  - uv sync --no-install-project

test_script:
  - make test-unit
  - make format
  - make lint
  - make check

on_finish:
  - make clean-all