version: 1.0.{build}
build: off

environment:
  UV_NO_PROGRESS: "1"
  PYTHON: "C:\\Python314-x64"

install:
  - set PATH=%PYTHON%;%PYTHON%\Scripts;%PATH%
  - python -c "import struct; print(struct.calcsize('P') * 8)"
  - choco install make -y
  - pip install uv
  - uv --version
  - uv sync --no-install-project

test_script:
  - make test-unit
  - make format
  - make lint
  - make check

on_finish:
  - make clean-all