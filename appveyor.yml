version: "{build}"
image: Visual Studio 2022
platform: x64

environment:
  UV_NO_PROGRESS: "1"

install_chocolatey:
  - choco install make -y

install:
  - pip install uv
  - uv --version
  - uv sync --no-install-project

unit_test:
  - make test-unit
  - quality_checks:
      - make format
      - make lint
      - make check
cleanup:
  - make clean-all